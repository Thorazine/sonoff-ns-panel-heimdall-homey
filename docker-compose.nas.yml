version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/nas/Dockerfile
      args:
        APP_UID: ${APP_UID:-1026}
        APP_GID: ${APP_GID:-100}
    image: heimdall-kiosk-app:latest
    container_name: heimdall-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - heimdall

  nginx:
    image: nginx:1.27-alpine
    container_name: heimdall-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nas/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - heimdall

  queue:
    image: heimdall-kiosk-app:latest
    container_name: heimdall-queue
    restart: unless-stopped
    user: "${APP_UID:-1026}:${APP_GID:-100}"
    working_dir: /var/www/html
    command: ["bash", "/var/www/html/docker/nas/worker-entrypoint.sh", "queue"]
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - heimdall

  scheduler:
    image: heimdall-kiosk-app:latest
    container_name: heimdall-scheduler
    restart: unless-stopped
    user: "${APP_UID:-1026}:${APP_GID:-100}"
    working_dir: /var/www/html
    command: ["bash", "/var/www/html/docker/nas/worker-entrypoint.sh", "scheduler"]
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - heimdall

  reverb:
    image: heimdall-kiosk-app:latest
    container_name: heimdall-reverb
    restart: unless-stopped
    user: "${APP_UID:-1026}:${APP_GID:-100}"
    working_dir: /var/www/html
    command: ["bash", "/var/www/html/docker/nas/worker-entrypoint.sh", "reverb"]
    ports:
      - "${REVERB_PORT:-8081}:${REVERB_SERVER_PORT:-8080}"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - heimdall

  deployer:
    image: heimdall-kiosk-app:latest
    container_name: heimdall-deployer
    restart: unless-stopped
    user: "${APP_UID:-1026}:${APP_GID:-100}"
    working_dir: /var/www/html
    environment:
      DEPLOY_POLL_INTERVAL: "${DEPLOY_POLL_INTERVAL:-60}"
      GIT_REMOTE: "${GIT_REMOTE:-origin}"
      GIT_BRANCH: "${GIT_BRANCH:-master}"
      AUTO_SEED_FIRST_BOOT: "${AUTO_SEED_FIRST_BOOT:-true}"
    command: ["bash", "/var/www/html/docker/nas/auto-deploy.sh"]
    volumes:
      - .:/var/www/html
      - ../deploy-key:/deploy-key:ro
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - heimdall

  mysql:
    image: mysql:8.0
    container_name: heimdall-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-heimdall_kiosk}"
      MYSQL_USER: "${DB_USERNAME:-heimdall}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-heimdall_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-heimdall_root_secret}"
      TZ: "${APP_TIMEZONE:-Europe/Amsterdam}"
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=40
      - --table-open-cache=400
      - --table-definition-cache=400
      - --thread-cache-size=8
      - --mysqlx=0
      - --skip-name-resolve
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - heimdall

  redis:
    image: redis:7-alpine
    container_name: heimdall-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - heimdall

networks:
  heimdall:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
